# SPDX-License-Identifier: MIT

# Builds xsflib on its own whenever main changes: on Windows x64 with clang-cl. The Windows job runs ctest too. Changes
# to documentation alone don't start a run. Nor do changes to .clang-format, .gitignore or ci/ alone.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".clang-format", ".gitignore", "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: Windows x64 (clang-cl)
            os: windows-2025
            cmake: -A x64 -T ClangCL
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 4
