# SPDX-License-Identifier: MIT

# The steps of a project's CI job after the checkout: configure in build/, build the Release configuration, run ctest,
# print the tests' annotations, and upload a file of the build if the job names one. With foobar2000 set, the job
# first downloads the foobar2000 SDK (../foobar2000-sdk) and builds the project's component against it. With xmplay
# set, the job first downloads the XMPlay plugin SDK (../xmplay-sdk) and builds the project's XMPlay plugin against it,
# in a 32-bit Windows job. A workflow checks the project out with its submodules, then uses the action by its path in
# the checkout:
# uses: ./externals/xsflib/ci/build-and-test
name: Build and test
description: Configure, build and test the project in build/, and upload a file of the build
inputs:
  cmake:
    description: More options for CMake's configure step, such as the generator's platform and toolset
    required: false
    default: ""
  foobar2000:
    description: "'true' to download the foobar2000 SDK and build the component against it"
    required: false
    default: "false"
  foobar2000-version:
    description: The foobar2000 SDK's version, if the project pins one other than the SDK action's default
    required: false
    default: ""
  foobar2000-sha256:
    description: The SHA-256 of that SDK's archive
    required: false
    default: ""
  xmplay:
    description: "'true' to download the XMPlay plugin SDK and build the plugin against it (32-bit Windows only)"
    required: false
    default: "false"
  xmplay-sha256:
    description: The SHA-256 of the XMPlay plugin SDK's archive, if the project pins one other than the SDK action's default
    required: false
    default: ""
  test-timeout:
    description: ctest's limit for each test, in seconds, or empty for ctest's default
    required: false
    default: ""
  test-jobs:
    description: The number of tests that ctest runs at once
    required: false
    default: "4"
  artifact-name:
    description: The name of an artifact to upload after the tests, or empty for none
    required: false
    default: ""
  artifact-path:
    description: The file or folder that the artifact holds
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download the foobar2000 SDK
      if: inputs.foobar2000 == 'true' && inputs.foobar2000-version == ''
      uses: ./externals/xsflib/ci/foobar2000-sdk
    - name: Download the project's foobar2000 SDK
      if: inputs.foobar2000 == 'true' && inputs.foobar2000-version != ''
      uses: ./externals/xsflib/ci/foobar2000-sdk
      with:
        version: ${{ inputs.foobar2000-version }}
        sha256: ${{ inputs.foobar2000-sha256 }}
    - name: Download the XMPlay plugin SDK
      if: inputs.xmplay == 'true' && inputs.xmplay-sha256 == ''
      uses: ./externals/xsflib/ci/xmplay-sdk
    - name: Download the project's XMPlay plugin SDK
      if: inputs.xmplay == 'true' && inputs.xmplay-sha256 != ''
      uses: ./externals/xsflib/ci/xmplay-sdk
      with:
        sha256: ${{ inputs.xmplay-sha256 }}
    - name: Configure
      shell: bash
      run: >-
        cmake -S . -B build ${{ inputs.cmake }} ${{ inputs.foobar2000 == 'true' && '-DFOOBAR2000_SDK_DIR=sdk' || '' }}
        ${{ inputs.xmplay == 'true' && '-DXMPLAY_SDK_DIR=xmp-sdk' || '' }}
    - name: Build
      shell: bash
      run: cmake --build build --config Release --parallel
    - name: Test
      shell: bash
      run: >-
        ctest --test-dir build --build-config Release --output-on-failure --parallel ${{ inputs.test-jobs }}
        ${{ inputs.test-timeout != '' && format('--timeout {0}', inputs.test-timeout) || '' }}
    # A test can write GitHub Actions workflow commands, such as a warning, to a file named annotations.txt in the
    # build folder. With --output-on-failure, ctest prints nothing of a test that passes. This step prints the files
    # whatever the tests' outcome. The run's summary then shows the annotations.
    - name: Print the tests' annotations
      if: always()
      shell: bash
      run: if [ -d build ]; then find build -name annotations.txt -type f -exec cat {} +; fi
    - name: Upload the artifact
      if: inputs.artifact-name != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}
