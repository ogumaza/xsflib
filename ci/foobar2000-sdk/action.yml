# SPDX-License-Identifier: MIT

# Downloads the foobar2000 SDK from foobar2000.org, checks its SHA-256 and unpacks it into sdk/ in the workspace. A
# project's foobar2000 component builds against it. The SDK isn't stored in xsflib or in the projects that use it. The
# version is pinned so that a new SDK can't break CI without warning. A project that requires another SDK passes its
# version and SHA-256 as inputs. An empty input takes the pin. To move to a newer SDK, change the pins in the script
# below and check that the components still build. The action runs on Windows and macOS runners. 7-Zip unpacks the SDK
# on Windows. On macOS, tar unpacks it (bsdtar reads 7z archives). A workflow uses the action by its path in the
# project's checkout:
# uses: ./externals/xsflib/ci/foobar2000-sdk
name: foobar2000 SDK
description: Download the foobar2000 SDK and unpack it into sdk/
inputs:
  version:
    description: The SDK's version, the date in its file name, or empty for the pinned SDK
    required: false
    default: ""
  sha256:
    description: The SHA-256 of the SDK's archive, or empty for the pinned SDK's
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download the foobar2000 SDK
      shell: pwsh
      env:
        SDK_VERSION: ${{ inputs.version }}
        SDK_SHA256: ${{ inputs.sha256 }}
      run: |
        $pinnedVersion = "2026-10-01"
        $pinnedSha256 = "d4c55077336fae81bf8df0259b5b2748fa45ea84132c656ead93eb123cbcdc26"
        $version = if ($env:SDK_VERSION) { $env:SDK_VERSION } else { $pinnedVersion }
        $sha256 = if ($env:SDK_SHA256) { $env:SDK_SHA256 } else { $pinnedSha256 }
        $url = "https://www.foobar2000.org/downloads/SDK-$version.7z"
        Write-Host "SDK: $url"
        Invoke-WebRequest -UseBasicParsing $url -OutFile sdk.7z
        $hash = (Get-FileHash -Algorithm SHA256 sdk.7z).Hash.ToLowerInvariant()
        if ($hash -ne $sha256) { throw "the SDK's SHA-256 is $hash, not $sha256" }
        if ($IsWindows) {
          7z x sdk.7z -osdk | Out-Null
        } else {
          New-Item -ItemType Directory -Force sdk | Out-Null
          tar -xf sdk.7z -C sdk
        }
